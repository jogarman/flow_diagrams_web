<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Diagramas de Flujo</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #22c55e;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .symbol-card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .symbol-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .shape {
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: #333;
        }

        /* Formas Geométricas */
        .terminal { width: 100px; height: 50px; border: 3px solid #ef4444; border-radius: 25px; }
        .process { width: 100px; height: 60px; border: 3px solid #3b82f6; }
        .decision { width: 70px; height: 70px; border: 3px solid #f59e0b; transform: rotate(45deg); }
        .decision span { transform: rotate(-45deg); }
        .io { width: 100px; height: 50px; border: 3px solid #a855f7; transform: skew(-20deg); }

        #detail-view {
            background: #1e293b;
            color: white;
            padding: 25px;
            border-radius: 12px;
            min-height: 100px;
            margin-top: 20px;
            display: none;
        }

        .interactive-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Diccionario Visual de Diagramas</h1>
        <p>Haz clic en las formas para entender su lógica</p>
    </header>

    <div class="grid">
        <div class="symbol-card" onclick="showDetail('Inicio/Fin', 'Representa el comienzo o el cierre de un algoritmo. Todo diagrama debe empezar y terminar con esta forma.')">
            <div class="shape terminal"></div>
            <h3>Terminal</h3>
        </div>
        <div class="symbol-card" onclick="showDetail('Proceso', 'Se usa para cualquier tipo de operación que cambie un valor: cálculos matemáticos, asignaciones de variables o ejecución de comandos.')">
            <div class="shape process"></div>
            <h3>Proceso</h3>
        </div>
        <div class="symbol-card" onclick="showDetail('Decisión', 'Aquí es donde la lógica se divide. Basado en una condición (¿Es X mayor que 10?), el flujo tomará el camino del SÍ o del NO.')">
            <div class="shape decision"><span></span></div>
            <h3>Decisión</h3>
        </div>
        <div class="symbol-card" onclick="showDetail('Entrada/Salida', 'Se utiliza cuando el programa necesita recibir datos (leer del teclado) o mostrar resultados (imprimir en pantalla).')">
            <div class="shape io"></div>
            <h3>E/S</h3>
        </div>
    </div>

    <div id="detail-view">
        <h2 id="detail-title"></h2>
        <p id="detail-text"></p>
    </div>

    <div class="interactive-section" style="margin-top: 40px;">
        <h2>Simulador de Lógica Rápida</h2>
        <p>¿Qué pasa si tienes hambre?</p>
        <div id="flow-demo">
            <button onclick="runFlow()">Iniciar Proceso</button>
        </div>
        <p id="flow-output" style="font-weight: bold; color: var(--primary); margin-top: 15px;"></p>
    </div>
</div>

<script>
    function showDetail(title, text) {
        const detailView = document.getElementById('detail-view');
        document.getElementById('detail-title').innerText = title;
        document.getElementById('detail-text').innerText = text;
        detailView.style.display = 'block';
        window.scrollTo({ top: detailView.offsetTop - 50, behavior: 'smooth' });
    }

    function runFlow() {
        const output = document.getElementById('flow-output');
        output.innerText = "1. Inicio 🏁";
        
        setTimeout(() => {
            output.innerText += " -> 2. ¿Tienes hambre? (Decisión) 🤔";
            setTimeout(() => {
                const hambre = confirm("¿Tienes hambre ahora mismo?");
                if(hambre) {
                    output.innerText += " -> 3. SÍ: Preparar comida (Proceso) 🍳 -> 4. Fin ✅";
                } else {
                    output.innerText += " -> 3. NO: Seguir trabajando (Proceso) 💻 -> 4. Fin ✅";
                }
            }, 500);
        }, 1000);
    }
</script>

</body>
</html>
